      expect: { stated_by: sh-dana-okafor, priority: must, status: active }
    - match: { file: billing-replatform, keywords_any: [api] }
      expect: { stated_by: sh-priya-sharma, priority: should, status: active }
    - match: { file: billing-replatform, keywords_any: [csv] }
      expect: { stated_by: unattributed, status: active }
  scope:
    - match: { file: billing-replatform, keywords_any: [engine] }
      expect: { state: in }
    - match: { file: billing-replatform, keywords_any: [invoice] }
      expect: { state: in }
    - match: { file: billing-replatform, keywords_any: [history] }
      expect: { state: in }
    - match: { file: billing-replatform, keywords_any: [mobile] }
      expect: { state: undecided }
  drops:
    - match: { id: drop-2024-01-24-requirements-workshop }
  commit_protocol:
