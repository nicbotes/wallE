# Cumulative expected state after drop 02 (requirements workshop).
drop: drop-2024-01-24-requirements-workshop
deterministic:
  stakeholders:
    - match: { id: sh-priya-sharma }
      expect: { status: active, disposition: champion, influence: high }
    - match: { id: sh-marcus-webb }
      expect: { status: active, disposition: skeptical, influence: high }
    - match: { id: sh-dana-okafor }
      expect: { status: active, disposition: neutral, influence: medium, reports_to: sh-priya-sharma }
  projects:
    - match: { id: proj-billing-replatform }
      expect: { status: active }
