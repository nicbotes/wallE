# Cumulative expected state after drop 10 (year-end review).
drop: drop-2024-12-05-year-end-review
deterministic:
  projects:
    - match: { id: proj-billing-replatform }
      expect: { status: active, phase: { one_of: [migrate, migration] } }
  incentives:
    - match: { file: incentives.md, keywords_any: [quick] }
      expect: { stakeholder: sh-tom-nagel, kind: stated, confidence: high }
  requirements:
    - match: { file: billing-replatform, keywords_any: [dual] }
      expect: { stated_by: sh-dana-okafor, status: active }
  decisions:
    - match: { file: billing-replatform, date: 2024-07-30 }
      expect: { status: active }
