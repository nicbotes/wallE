    - match: { keywords_any: [cutover, overtime] }
      expect: { status: open }
  drops:
    - match: { id: drop-2024-12-05-year-end-review }
  commit_protocol:
    source: drop-2024-12-05-year-end-review
    min_findings:
      drop: 1
      project-update: 1
      incentive-new: 1
      confirm: 1
