      as: DEC_SELFHOST
      expect:
        status: active
        decided_by: { includes: [sh-priya-sharma] }
  tensions:
    - match: { keywords_any: [speed, pace, budget] }
      expect:
        status: open
        between: { includes: [sh-marcus-webb, sh-priya-sharma] }
