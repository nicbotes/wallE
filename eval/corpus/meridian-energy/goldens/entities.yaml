# Master allowlist for precision grading.
#
# After ingesting drop N, every structured entity in the brain must match one
# entry here with `from <= N` — anything else is a hallucination (precision
# hit). Entries marked `note: optional` are legitimate judgment-call
# extractions that don't appear in the recall goldens.
#
# Deliberately NOT allowed (they are the red herrings / noise):
# - JN / KT / RM (our own consultants) as stakeholders
# - the data-warehouse idea (parked at kickoff), the BillFlow vendor mention,
#   Marcus's ERP war story, the CRM/Kubernetes asides, farewell party logistics
# - any decision entity for the June 2024 Hermes scope call (that's a
#   scope-move, not a decision entity)

stakeholders:
  - { from: 1,  match: { id: sh-priya-sharma } }
  - { from: 1,  match: { id: sh-marcus-webb } }
  - { from: 1,  match: { id: sh-dana-okafor } }
  - { from: 8,  match: { id: sh-tom-nagel } }
  - { from: 11, match: { id: sh-aisha-bell } }

